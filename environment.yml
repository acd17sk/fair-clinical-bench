name: fair-clinical-bench
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - py-xgboost>=2.0
  - matplotlib>=3.7
  - click>=8.1
  - pyyaml>=6.0
  - tabulate>=0.9
  # dev
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff>=0.4
  - mypy>=1.7
  - pip
  # SHAP is best installed via pip — conda-forge build can lag
  - pip:
      - shap>=0.44
      - -e .
